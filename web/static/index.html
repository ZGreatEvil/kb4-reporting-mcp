<!doctype html>
<html lang="id" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#E8EEF9" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0B1220" media="(prefers-color-scheme: dark)" />
  <title>KnowBe4 AI Analyst</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />

  <!-- built from tailwind.input.css with the tailwind cli; see README, "Changing the styles" -->
  <link rel="stylesheet" href="/static/app.css" />
  <!-- served from here (checked against jsdelivr's hashes), so the page works offline and under a strict CSP -->
  <script src="/static/vendor/marked.umd.js" defer></script>
  <script src="/static/vendor/purify.min.js" defer></script>
  <script src="/static/vendor/lucide.min.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>

<body class="h-full bg-gradient-to-br from-[#E8EEF9] via-[#F4F6FB] to-[#E3E8F5] dark:from-[#0B1220] dark:via-[#0F172A] dark:to-[#111827] text-slate-800 dark:text-slate-100 antialiased selection:bg-blue-500 selection:text-white flex items-center justify-center sm:p-3 md:p-6 overflow-hidden">

  <!-- ambient glow -->
  <div class="fixed top-[-10%] left-[-5%] w-[450px] h-[450px] rounded-full bg-blue-400/25 dark:bg-blue-500/10 blur-[120px] pointer-events-none" aria-hidden="true"></div>
  <div class="fixed bottom-[-10%] right-[-5%] w-[500px] h-[500px] rounded-full bg-indigo-300/30 dark:bg-indigo-500/10 blur-[140px] pointer-events-none" aria-hidden="true"></div>

  <div class="app-shell relative w-full max-w-5xl flex flex-col sm:rounded-3xl bg-white/70 dark:bg-slate-900/70 backdrop-blur-2xl sm:border border-white/80 dark:border-slate-700/60 shadow-apple-glass overflow-hidden">

    <!-- wraps onto two rows on narrow screens instead of squeezing -->
    <header class="flex flex-wrap items-center justify-between gap-2 px-3 sm:px-6 py-3 border-b border-white/60 dark:border-slate-700/60 bg-white/30 dark:bg-slate-900/30 backdrop-blur-md">
      <div class="flex items-center gap-2.5 min-w-0">
        <div class="p-1.5 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 text-white shadow-md shadow-blue-500/20 shrink-0" aria-hidden="true">
          <i data-lucide="shield-alert" class="w-4 h-4"></i>
        </div>
        <h1 class="text-sm font-bold text-slate-800 dark:text-slate-100 tracking-tight whitespace-nowrap">KnowBe4 AI Analyst</h1>
      </div>

      <!-- on phones this is its own full-width row: status left, buttons right -->
      <div class="flex items-center justify-between sm:justify-end gap-2 w-full sm:w-auto">
        <!-- live server status and the configured console; polled from /health -->
        <span id="status" role="status" class="chip" data-state="checking">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="status-text">…</span>
          <span class="hidden sm:inline text-slate-400 dark:text-slate-500" aria-hidden="true">·</span>
          <span id="consoles" class="hidden sm:inline">KnowBe4</span>
        </span>

        <div class="flex items-center gap-2">
          <button type="button" id="new-chat" class="btn btn-secondary" disabled>
            <i data-lucide="square-pen" class="w-4 h-4" aria-hidden="true"></i>
            <span id="new-chat-label" class="hidden sm:inline">Baru</span>
          </button>

          <!-- language switch; the chosen language also goes to the model with each question -->
          <div id="lang-switch" role="group" aria-label="Bahasa / Language" class="segmented">
            <button type="button" data-lang="id" aria-pressed="false" class="lang-btn">ID</button>
            <button type="button" data-lang="en" aria-pressed="false" class="lang-btn">EN</button>
          </div>
        </div>
      </div>
    </header>

    <main id="chat" aria-live="polite" aria-relevant="additions" class="flex-1 overflow-y-auto overscroll-contain p-3 sm:p-6 space-y-5">
      <noscript><p class="text-sm text-center text-rose-600">JavaScript diperlukan · JavaScript is required.</p></noscript>

      <!-- first-visit language picker; hidden once a language is chosen -->
      <section id="lang-picker" class="hidden mx-auto mt-6 w-full max-w-sm bubble-ai p-5 text-center" aria-labelledby="lang-picker-title">
        <h2 id="lang-picker-title" class="text-sm font-semibold text-slate-800 dark:text-slate-100">Pilih bahasa · Choose language</h2>
        <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Bisa diganti kapan saja lewat ID | EN · You can switch any time with ID | EN</p>
        <div class="mt-4 grid grid-cols-1 sm:grid-cols-2 gap-3">
          <button type="button" data-lang="id" class="pick-btn btn btn-secondary w-full">Bahasa Indonesia</button>
          <button type="button" data-lang="en" class="pick-btn btn btn-secondary w-full">English</button>
        </div>
      </section>

      <div id="welcome" class="hidden msg-ai">
        <div class="avatar" aria-hidden="true"><i data-lucide="bot" class="w-4 h-4"></i></div>
        <div id="welcome-text" class="bubble-ai p-4 text-sm leading-relaxed prose-ai"></div>
      </div>
    </main>

    <footer class="px-3 sm:px-6 pt-2 pb-[max(0.75rem,env(safe-area-inset-bottom))] sm:pb-4 bg-gradient-to-t from-white/80 via-white/50 to-transparent dark:from-slate-900/80 dark:via-slate-900/50 backdrop-blur-sm">
      <form id="form" class="flex items-end gap-1.5 bg-white/85 dark:bg-slate-800/85 backdrop-blur-xl border border-white dark:border-slate-700 rounded-2xl shadow-lg p-1.5 focus-within:ring-2 focus-within:ring-blue-500/40 focus-within:border-blue-500/50 transition-shadow">
        <textarea
          id="message"
          rows="1"
          maxlength="4000"
          placeholder="Tanya laporan KnowBe4…"
          aria-label="Pertanyaan Anda"
          aria-describedby="counter"
          class="flex-1 min-w-0 bg-transparent border-0 text-base sm:text-sm text-slate-800 dark:text-slate-100 placeholder-slate-500 dark:placeholder-slate-400 focus:outline-none focus:ring-0 px-3 py-2.5 resize-none overflow-y-hidden max-h-32 h-11 min-h-[44px] leading-6"
        ></textarea>

        <button id="send" type="submit" aria-label="Kirim pertanyaan" class="btn btn-primary">
          <!-- icon only on phones, so the question box keeps room for its placeholder -->
          <span id="send-label" class="hidden sm:inline">Kirim</span>
          <i data-lucide="arrow-up" class="w-4 h-4" aria-hidden="true"></i>
        </button>
      </form>

      <div class="flex items-center justify-between gap-2 mt-2 text-[11px] text-slate-500 dark:text-slate-400">
        <span id="footnote" class="flex-1 text-center">Model AI lokal · data KnowBe4 tidak keluar dari komputer ini</span>
        <span id="counter" class="hidden tabular-nums" aria-live="polite"></span>
      </div>
    </footer>
  </div>
</body>
</html>
