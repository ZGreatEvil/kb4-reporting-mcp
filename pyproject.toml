[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "knowbe4-reporting-mcp"
version = "1.1.0"
description = "Multi-console KnowBe4 Reporting API MCP server with a local LLM chat interface."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.0,<3",
  "openai>=3.46,<4",
  "matplotlib>=3.11,<4",
  "pypdf>=6.21,<7",
  "httpx>=0.27,<1",
  "python-dotenv>=1.0,<2",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "PyYAML>=6.0,<7",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "jinja2>=3.1,<4",
  "tenacity>=9.0,<10",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.8,<1"]

[tool.setuptools.packages.find]
include = ["config*", "agent*", "kb4_mcp*", "knowbe4*", "web*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
extend-exclude = [".claude"]

[tool.ruff.lint]
# ruff's defaults plus bugbear and import order
select = ["E4", "E7", "E9", "F", "B", "I"]
